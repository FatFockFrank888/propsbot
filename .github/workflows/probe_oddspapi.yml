name: probe-oddspapi
on:
  workflow_dispatch:
  push:
    paths: ['tools/probe_oddspapi.py', '.github/workflows/probe_oddspapi.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I tools/probe_oddspapi.py
        env:
          ODDS_PAPI_KEY: ${{ secrets.ODDS_PAPI_KEY }}
