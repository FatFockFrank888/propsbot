name: bevaka-odds

on:
  schedule:
    - cron: "*/10 6-22 * * *"   # var 10:e minut 06–22 UTC (GitHub kan fördröja några minuter)
  workflow_dispatch: {}          # kör manuellt från fliken Actions

concurrency:
  group: bevaka
  cancel-in-progress: false

jobs:
  skanna:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Kom ihåg vilka ben som redan notifierats mellan körningarna.
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Skanna och skicka notiser
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PROPSBOT_STATE_DIR: state
        run: python -m propsbot skanna

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: state-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnos-${{ github.run_id }}
          path: |
            state/diagnos
            state/resultat
          retention-days: 3
