name: bevaka-odds

on:
  schedule:
    - cron: "7-59/10 6-22 * * *"   # var 10:e minut (:07, :17 …) 06–22 UTC, undviker rusningen på hela minuter
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bevaka
  cancel-in-progress: false

jobs:
  skanna:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Bokföring och notisminne ligger i grenen "data" så att inget försvinner.
      - name: Hämta sparat läge
        run: |
          git config user.name "propsbot"
          git config user.email "propsbot@users.noreply.github.com"
          if git fetch --depth 1 origin data:data 2>/dev/null; then
            git worktree add state data
          else
            git worktree add --orphan -b data state
          fi
          printf '.cache_odds/\n*.sqlite\n' > state/.gitignore

      - name: Skanna, bokför, rätta och skicka notiser
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PROPSBOT_STATE_DIR: state
        run: python -m propsbot skanna

      - name: Prova datakällor
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python -m propsbot.probe

      - name: Spara läge
        if: always()
        run: |
          cd state
          git add -A
          git commit -q -m "läge $(date -u +%FT%TZ)" || echo "inget nytt"
          git push -q origin data || echo "kunde inte spara"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: state/site

      - uses: actions/deploy-pages@v4

      # GitHubs schema startar inte pålitligt. Därför startar varje körning nästa:
      # 10 min mellan skanningarna 06–22 UTC, 60 min på natten. Schemat ovan finns kvar som reserv.
      - name: Starta nästa körning
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          H=$(date -u +%H)
          if [ "$H" -ge 6 ] && [ "$H" -lt 22 ]; then WAIT=480; else WAIT=3300; fi
          sleep $WAIT
          gh workflow run bevaka.yml --repo "$GITHUB_REPOSITORY" --ref main
