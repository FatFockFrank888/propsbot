name: bevaka-odds

on:
  schedule:
    # Reserv om kedjan bryts. Fotboll/NBA/NHL i samma körning, dygnet runt (NHL-kvällar till 05 svensk tid).
    - cron: "7-59/10 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bevaka
  cancel-in-progress: false

jobs:
  skanna:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: github-pages
    steps:
      # GitHubs schema startar inte pålitligt, och ett steg i slutet kan hänga (7/11: kedjan bröts i 3,5 h).
      # Därför ställs nästa körning i kö FÖRST: den väntar (concurrency) tills denna är klar, oavsett hur denna slutar.
      # Stoppa boten helt: stäng av arbetsflödet (Disable workflow).
      - name: Ställ nästa körning i kö
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do
            timeout 60 gh workflow run bevaka.yml --repo "$GITHUB_REPOSITORY" --ref main && exit 0
            sleep 15
          done
          echo "kunde inte ställa nästa körning i kö – schemat är reserv"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Bokföring och notisminne ligger i grenen "data" så att inget försvinner.
      - name: Hämta sparat läge
        run: |
          git config user.name "propsbot"
          git config user.email "propsbot@users.noreply.github.com"
          if git fetch --depth 1 origin data:data 2>/dev/null; then
            git worktree add state data
          else
            git worktree add --orphan -b data state
          fi
          # NHL:s linjehistorik (nhl/line_history.sqlite) sparas; fotbollens stora SQLite-logg gör det inte.
          printf '.cache_odds/\n/*.sqlite\nnhl/output/\nnhl/odds/\n' > state/.gitignore

      # NHL-statistiken (spelarloggar, scheman) cachas mellan körningar så att skanningen går fort.
      - name: HTTP-cache (NHL)
        uses: actions/cache@v4
        with:
          path: state/.cache_odds/nhl
          key: nhl-http-${{ github.run_id }}
          restore-keys: nhl-http-

      - name: Skanna, bokför, rätta och skicka notiser
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
          PROPSBOT_STATE_DIR: state
        run: python -m propsbot skanna

      # Källtestet (python -m propsbot.probe) körs inte längre automatiskt: kedjan startar varje
      # körning som workflow_dispatch, så det gick var 15:e minut och fick API-Football-kontot avstängt.
      # Kör det för hand vid behov.

      - name: Spara läge
        if: always()
        run: |
          cd state
          git add -A
          git commit -q -m "läge $(date -u +%FT%TZ)" || echo "inget nytt"
          # Har grenen ändrats under körningen läggs vårt läge ovanpå (vid krock vinner vårt nyare läge).
          for i in 1 2 3; do
            git push -q origin data && break
            git fetch -q --deepen=50 origin data && git rebase -q -X theirs FETCH_HEAD               || { git rebase --abort 2>/dev/null; echo "kunde inte spara"; break; }
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: state/site

      # GitHub hittar ibland inte nyss uppladdade sidan (tillfälligt API-fel) – försök igen efter en paus.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Vänta innan nytt publiceringsförsök
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # Paus mellan skanningarna (nästa körning står redan i kö och startar när denna är klar):
      # 8 min, 55 min 04–06 UTC.
      - name: Paus före nästa körning
        if: ${{ !cancelled() }}
        run: |
          H=$(date -u +%H)
          if [ "$H" -ge 4 ] && [ "$H" -lt 6 ]; then sleep 3300; else sleep 480; fi
